<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F6F7; --card:#FFFFFF; --ink:#16222A; --muted:#5A6A73; --line:#D3DDE1;
  --lake:#1D5C6E; --lake-soft:#DDEBEF; --saffron:#B97C08; --saffron-soft:#FBEFD2; --blush:#F4E4DE;
  --m1:#E2231A; --m2:#00914A; --m5:#8A5FB2; --rail:#33424B; --boat:#1D6E86; --air:#4A5A66;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E161B; --card:#15212A; --ink:#E7EEF1; --muted:#9BACB5; --line:#25343D;
    --lake:#86C6D8; --lake-soft:#16323C; --saffron:#F2B53E; --saffron-soft:#35290F; --blush:#352725;
    --rail:#5B6C76; --boat:#3E97B0; --air:#6E808C;
  }
}
:root[data-theme="dark"]{
  --paper:#0E161B; --card:#15212A; --ink:#E7EEF1; --muted:#9BACB5; --line:#25343D;
  --lake:#86C6D8; --lake-soft:#16323C; --saffron:#F2B53E; --saffron-soft:#35290F; --blush:#352725;
  --rail:#5B6C76; --boat:#3E97B0; --air:#6E808C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:var(--lake)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Header + date strip */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 8px}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;margin:0}
.status{margin:0;color:var(--muted);font-size:.95rem;white-space:nowrap}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:58px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 10px 8px;text-align:center;cursor:pointer;position:relative}
.day .wd{display:block;font-size:.8rem;color:var(--muted)}
.day .dn{display:block;font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.1}
.day[aria-selected="true"]{background:var(--lake);border-color:var(--lake);color:#fff}
.day[aria-selected="true"] .wd{color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .day[aria-selected="true"]{color:#0E161B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .day[aria-selected="true"]{color:#0E161B}}
.day .today{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);background:var(--saffron);color:#fff;font-size:.66rem;padding:1px 6px;border-radius:8px;white-space:nowrap}
.day.bday{background:var(--blush)}
.day.bday[aria-selected="true"]{background:var(--lake)}

main.wrap{padding-bottom:calc(var(--tabh, 96px) + 40px)}

/* Day header */
.dayhead{padding:18px 0 6px}
.dayhead h2{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.1;letter-spacing:-.015em;margin:0}
.dayhead p{margin:4px 0 0;color:var(--muted)}
.tznote{font-size:.9rem;color:var(--muted);margin:6px 0 0}
/* Day photo: the header sits on the picture */
.hero{position:relative;margin:16px 0 4px;border-radius:18px;overflow:hidden;background:var(--lake-soft);aspect-ratio:16/10;max-height:300px;width:100%}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,16,22,.82) 0%,rgba(8,16,22,.35) 42%,rgba(8,16,22,0) 68%)}
.hero .cap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:14px 16px 26px;color:#fff}
.hero .cap h2{color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hero .cap p{color:rgba(255,255,255,.9);margin:4px 0 0}
.hero .credit{position:absolute;right:10px;bottom:6px;z-index:1;font-size:.7rem;color:rgba(255,255,255,.75);text-decoration:none;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .credit:hover{color:#fff;text-decoration:underline}
.dayhead.ph{padding:0}
.dayhead.ph .tznote{margin:8px 2px 0}
@media (prefers-reduced-motion: no-preference){
  .hero img{animation:settle 1.2s ease-out both}
  @keyframes settle{from{transform:scale(1.04)}to{transform:none}}
}
.alerts{list-style:none;margin:14px 0 6px;padding:12px 14px;background:var(--saffron-soft);border-left:4px solid var(--saffron);border-radius:0 12px 12px 0}
.alerts li{padding:3px 0}
.alerts li+li{border-top:1px dashed color-mix(in srgb, var(--saffron) 35%, transparent)}

/* Timeline */
.tl{list-style:none;margin:14px 0 0;padding:0}
.row{display:grid;grid-template-columns:5.6rem 22px 1fr;column-gap:8px;position:relative}
.row .when{text-align:right;padding-top:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .rail{position:relative}
.row .rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:var(--line)}
.row:first-child .rail::before{top:18px}
.row:last-child .rail::before{bottom:calc(100% - 18px)}

.stop .when{font-weight:700;color:var(--ink)}
.stop .rail::after{content:"";position:absolute;left:50%;top:15px;width:14px;height:14px;transform:translateX(-50%);border-radius:50%;background:var(--card);border:3px solid var(--lake)}
.stop.booked .rail::after{background:var(--lake)}
.stop.todo .rail::after{border-color:var(--saffron);border-style:dashed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.card h3{margin:0;font-size:1.02rem;line-height:1.3}
.card .d{margin:0;color:var(--muted);font-size:.95rem;grid-column:1/2}
.card .links{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-top:2px}
.card .links a{text-decoration:none;font-weight:700}
.card .links a:hover{text-decoration:underline}
.tag{display:inline-block;font-size:.76rem;padding:1px 7px;border-radius:7px;margin-left:6px;vertical-align:2px;font-weight:700}
.tag.b{background:var(--lake-soft);color:var(--lake)}
.tag.t{background:var(--saffron-soft);color:var(--saffron)}
.check{grid-row:1/3;grid-column:2;align-self:start;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;font-size:1rem;color:transparent}
.check[aria-pressed="true"]{background:var(--lake);border-color:var(--lake);color:#fff}
.done .card{opacity:.55}
.done .card h3{text-decoration:line-through}
.next .card{border:2px solid var(--saffron);box-shadow:0 0 0 4px var(--saffron-soft)}
.nextpill{display:inline-block;background:var(--saffron);color:#fff;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:7px;margin-right:6px;vertical-align:2px}

/* Transit legs — metro-signage badges */
.leg .when{color:var(--muted);font-size:.92rem;padding-top:9px}
.leg .rail::before{background:repeating-linear-gradient(to bottom,var(--muted) 0 4px,transparent 4px 8px);opacity:.6}
.legbody{display:flex;align-items:flex-start;gap:8px;padding:6px 0 6px 2px}
.badges{display:flex;gap:4px;flex:0 0 auto;padding-top:1px}
.bdg{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 6px;border-radius:6px;color:#fff;background:#5B6770;font-family:var(--display);font-weight:800;font-size:.86rem;letter-spacing:.01em}
.bdg.M1{background:var(--m1)} .bdg.M2{background:var(--m2)} .bdg.M5{background:var(--m5)}
.bdg.train{background:var(--rail)} .bdg.tram{background:#E08A00} .bdg.bus{background:#2E7D32} .bdg.metro,.bdg.subway,.bdg.M3{background:#C9A100} .bdg.car{background:var(--rail)} .bdg.boat{background:var(--boat)} .bdg.flight{background:var(--air)}
.bdg.walk{background:transparent;color:var(--ink);border:2px solid var(--muted);font-family:var(--body);font-weight:700;font-size:.8rem}
.legtext{font-size:.95rem;line-height:1.35}
.legtext b{font-weight:700}
.legtext .dur{display:block;color:var(--muted);font-size:.88rem}
.legtext a{font-size:.88rem;font-weight:700;text-decoration:none}

.approx{font-size:.88rem;color:var(--muted);margin:14px 0 0;padding-left:calc(5.6rem + 30px)}

/* Bookings */
.sect h2{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:20px 0 4px}
.sect > p{color:var(--muted);margin:0 0 12px}
.bk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.bk header{display:flex;align-items:center;gap:10px}
.bk .ico{font-size:1.5rem}
.bk h3{margin:0;font-size:1.08rem}
.bk .when2{margin:0;color:var(--muted);font-size:.93rem}
.ref{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
.ref code{font-family:var(--body);font-weight:700;font-size:1.12rem;letter-spacing:.03em;background:var(--lake-soft);color:var(--ink);padding:3px 8px;border-radius:8px}
.copy{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.88rem}
.bk ul{margin:6px 0 8px;padding-left:18px}
.bk li{margin:2px 0}
.bk .links{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:.92rem;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--lake)}

/* Checklist + money */
.cl{list-style:none;padding:0;margin:8px 0}
.cl li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.cl li .check{flex:0 0 auto;grid-row:auto;grid-column:auto}
.cl li.done span{text-decoration:line-through;color:var(--muted)}
.cl small{display:block;color:var(--muted)}
.money{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin:8px 0 4px}
.money td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.money td:nth-child(2),.money td:nth-child(3){text-align:right;white-space:nowrap}
.money tr.tot td{font-weight:700;border-bottom:none}
.fine{font-size:.88rem;color:var(--muted)}

/* Bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:transparent;padding:10px 0 12px;cursor:pointer;font-weight:700;color:var(--muted);font-size:.85rem}
.tab .i{display:block;font-size:1.25rem;line-height:1.2}
.tab[aria-selected="true"]{color:var(--lake)}
[hidden]{display:none!important}
.mapchips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.mapchips::-webkit-scrollbar{display:none}
.mapchip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem;cursor:pointer;color:var(--ink)}
.mapchip[aria-pressed="true"]{background:var(--lake);border-color:var(--lake);color:#fff}
:root[data-theme="dark"] .mapchip[aria-pressed="true"]{color:#0E161B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mapchip[aria-pressed="true"]{color:#0E161B}}
.mapcard{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:6px 0 12px;background:var(--lake-soft)}
.mapsvg{display:block;width:100%;height:auto}
.mapsvg .grid{stroke:var(--line);stroke-width:1}
.mapsvg .route{fill:none;stroke:var(--lake);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 7}
.mapsvg .mlabel{font-family:var(--body);font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--lake-soft);stroke-width:3px}
.mapsvg .north{font-family:var(--display);font-size:11px;font-weight:800;fill:var(--muted)}
.pin{transform-box:fill-box;transform-origin:center}
.gmaps{display:block;text-align:center;margin:4px 0 6px}
.daytitle{color:var(--muted);margin:0 0 6px}
.stoplist{list-style:none;padding:0;margin:8px 0}
.stoplist li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.pinbadge{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#D93025;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.85rem}
.stoplist small{display:block;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){
  .pin{animation:pop .35s ease-out both}
  .mapsvg .route{animation:fadein .7s ease-out both}
  @keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
}
.sub{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:22px 0 4px}
.wx{background:var(--lake-soft);border-radius:14px;padding:12px 14px;margin:10px 0}
.wx b{font-size:1.05rem}
.pkhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pkhead .fine{white-space:nowrap}
.dl{width:100%;border-collapse:collapse;margin:6px 0 4px}
.dl td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.dl td:first-child{white-space:nowrap;font-weight:700;padding-right:10px}
.dl tr.past td{color:var(--muted);text-decoration:line-through}
.gk{margin:6px 0;padding-left:18px}
.gk li{margin:6px 0}
.note{background:var(--saffron-soft);border-left:4px solid var(--saffron);border-radius:0 12px 12px 0;padding:10px 12px;margin:10px 0}

@media (prefers-reduced-motion: no-preference){
  .tl{animation:rise .35s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
@media (min-width:560px){ .row{grid-template-columns:6rem 24px 1fr} .approx{padding-left:calc(6rem + 32px)} }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1 id="title">Trip</h1><p class="status" id="status"></p></div>
    <div class="days" id="days" role="tablist" aria-label="Trip days"></div>
  </div>
</header>

<main class="wrap">
  <section id="view-days"></section>
  <section id="view-bookings" class="sect" hidden></section>
  <section id="view-map" class="sect" hidden></section>
  <section id="view-pack" class="sect" hidden></section>
  <section id="view-check" class="sect" hidden></section>
</main>

<nav class="tabbar" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-tab="days"><span class="i" aria-hidden="true">🗓️</span>Days</button>
    <button class="tab" role="tab" data-tab="map"><span class="i" aria-hidden="true">🗺️</span>Map</button>
    <button class="tab" role="tab" data-tab="bookings"><span class="i" aria-hidden="true">📎</span>Bookings</button>
    <button class="tab" role="tab" data-tab="pack"><span class="i" aria-hidden="true">🧳</span>Packing</button>
    <button class="tab" role="tab" data-tab="check"><span class="i" aria-hidden="true">✅</span>Prep</button>
  </div>

int-Michel to Châtelet, change to <b>Line 1<\/b> to Saint-Paul", "dur": "About 15 min, then 5 min on foot", "to": "Rue des Archives, Paris", "mode": "transit"}, {"kind": "s", "t": "10:30", "time": "10:30 AM", "title": "Drop bags — Hôtel Le Marais (demo hotel)", "d": "Room from 3 PM; bags held at reception.", "k": "b", "map": "Rue des Archives, Paris", "mode": "walking"}, {"kind": "s", "t": "11:00", "time": "11:00 AM", "title": "Coffee and a wander through the Marais", "d": "Place des Vosges, the oldest planned square in Paris, is 8 minutes away.", "map": "Place des Vosges, Paris", "mode": "walking"}, {"kind": "s", "t": "12:30", "time": "12:30 PM", "title": "Falafel on Rue des Rosiers", "d": "Quick, cheap, eaten standing up. Expect a short line.", "map": "Rue des Rosiers, Paris", "mode": "walking"}, {"kind": "l", "t": "13:45", "time": "1:45 PM", "modes": ["walk"], "text": "Across Pont Louis-Philippe to Île de la Cité", "dur": "About 15 min", "to": "Notre-Dame de Paris", "mode": "walking"}, {"kind": "s", "t": "14:00", "time": "2:00 PM", "title": "Notre-Dame de Paris", "d": "Reopened in December 2024 after the fire. Entry is free; a free timed reservation skips most of the line.", "map": "Notre-Dame de Paris", "mode": "walking"}, {"kind": "s", "t": "15:45", "time": "3:45 PM", "title": "Sainte-Chapelle", "d": "15 stained-glass windows in the upper chapel — best on a sunny afternoon. Timed ticket, €13 each (demo).", "k": "b", "map": "Sainte-Chapelle, Paris", "mode": "walking"}, {"kind": "s", "t": "17:00", "time": "5:00 PM", "title": "Check in and rest", "k": "b", "map": "Rue des Archives, Paris", "mode": "walking"}, {"kind": "l", "t": "19:30", "time": "7:30 PM", "modes": ["metro"], "text": "<b>Line 1<\/b> Saint-Paul to Louvre-Rivoli, then walk to Pont Neuf", "dur": "About 15 min", "to": "Vedettes du Pont Neuf, Paris", "mode": "transit"}, {"kind": "s", "t": "20:00", "time": "8:00 PM", "title": "Seine cruise at dusk", "d": "One hour, from the tip of Île de la Cité past the /* ---------- State (per-viewer, this browser only) ---------- */
const KEY = "trip-" + (TRIP.id || "default");
let S = {done:{}, todo:{}, pack:{}, day:null, tab:"days"};

/* ---------- Time helpers ---------- */
function nowIn(tz){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g = k => (p.find(x=>x.type===k)||{}).value;
  return {date:`${g("year")}-${g("month")}-${g("day")}`, mins:(parseInt(g("hour"),10)%24)*60+parseInt(g("minute"),10)};
}
const toMins = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const isToday = d => nowIn(d.tz).date === d.date;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function status(){
  const today = nowIn(TRIP.tz).date;
  const start = new Date(TRIP.start+"T00:00:00Z"), end = new Date(TRIP.end+"T00:00:00Z"), t = new Date(today+"T00:00:00Z");
  if (t < start) { const n = Math.round((start - t)/864e5); return n === 1 ? "Tomorrow!" : `${n} days to go`; }
  if (t > end) return "Home again";
  const i = DAYS.findIndex(d => d.date === today);
  return i >= 0 ? `Day ${i+1} of ${DAYS.length}` : "";
}

/* ---------- Render: day strip ---------- */
function renderStrip(){
  const el = document.getElementById("days");
  el.innerHTML = DAYS.map(d => {
    const today = isToday(d);
    return `<button class="day${d.bday?" bday":""}" role="tab" aria-selected="${S.day===d.id}" data-day="${d.id}" aria-label="${esc(d.name)}${today?", today":""}">
      <span class="wd">${d.bday?(d.mark||"🎂")+" ":""}${d.wd}</span><span class="dn">${d.dn}</span>${today?'<span class="today">Today</span>':""}</button>`;
  }).join("");
  el.querySelectorAll(".day").forEach(b => b.addEventListener("click", () => { S.day = b.dataset.day; save(); renderStrip(); renderDay(); window.scrollTo({top:0}); }));
  const sel = el.querySelector('[aria-selected="true"]'); if (sel) sel.scrollIntoView({inline:"center", block:"nearest"});
}

/* ---------- Render: a day ---------- */
function linksFor(it){
  const L = [];
  if (it.cal) L.push(`<a href="${it.cal}" target="_blank" rel="noopener">Calendar</a>`);
  if (it.mail) L.push(`<a href="${it.mail}" target="_blank" rel="noopener">Email</a>`);
  if (it.map) L.push(`<a href="${dir(it.map, it.mode)}" target="_blank" rel="noopener">Directions</a>`);
  if (it.ext) L.push(`<a href="${it.ext.href}" target="_blank" rel="noopener">${esc(it.ext.label)}</a>`);
  return L.length ? `<div class="links">${L.join("")}</div>` : "";
}
function badge(m){
  const label = {train:"Train", boat:"Boat", flight:"Flight", walk:"Walk", car:"Car", metro:"Metro", tram:"Tram", bus:"Bus", subway:"Subway"}[m] || m;
  return `<span class="bdg ${m}">${label}</span>`;
}
function renderDay(){
  const d = DAYS.find(x => x.id === S.day) || DAYS[0];
  const v = document.getElementById("view-days");
  let nextIdx = -1;
  if (isToday(d)) {
    const now = nowIn(d.tz).mins;
    nextIdx = d.items.findIndex((it,i) => it.kind==="s" && toMins(it.t) >= now - 10 && !S.done[d.id+"-"+i]);
  }
  const rows = d.items.map((it,i) => {
    const key = d.id+"-"+i, done = !!S.done[key];
    if (it.kind === "l") {
      const go = it.to ? ` <a href="${dir(it.to, it.mode)}" target="_blank" rel="noopener">Directions</a>` : "";
      return `<li class="row leg"><div class="when">${esc(it.time)}</div><div class="rail" aria-hidden="true"></div>
        <div class="legbody"><span class="badges">${it.modes.map(badge).join("")}</span>
        <span class="legtext">${it.text}<span class="dur">${esc(it.dur||"")}${go}</span></span></div></li>`;
    }
    const tag = it.k==="b" ? '<span class="tag b">Booked</span>' : it.k==="t" ? '<span class="tag t">To book</span>' : "";
    const next = i===nextIdx ? '<span class="nextpill">Next</span>' : "";
    return `<li class="row stop${it.k==="b"?" booked":""}${it.k==="t"?" todo":""}${done?" done":""}${i===nextIdx?" next":""}">
      <div class="when">${esc(it.time)}</div><div class="rail" aria-hidden="true"></div>
      <div class="card"><h3>${next}${esc(it.title)}${tag}</h3>
        <button class="check" aria-pressed="${done}" aria-label="Mark ${esc(it.title)} as done" data-key="${key}">✓</button>
        ${it.d?`<p class="d">${esc(it.d)}</p>`:""}${linksFor(it)}</div></li>`;
  }).join("");
  const ph = d.photo, cap = `<h2>${esc(d.name)}</h2><p>${esc(d.title)}</p>`;
  const head = ph && ph.src
    ? `<div class="dayhead ph"><figure class="hero" style="margin-left:0;margin-right:0"><img src="${esc(ph.src)}" alt="${esc(ph.alt||d.title)}" style="object-position:${esc(ph.pos||"50% 50%")}">
        <figcaption class="cap">${cap}</figcaption>${ph.credit?`<a class="credit" href="${esc(ph.href||"#")}" target="_blank" rel="noopener">Photo: ${esc(ph.credit)}</a>`:""}</figure>
        ${d.tznote?`<p class="tznote">${esc(d.tznote)}</p>`:""}</div>`
    : `<div class="dayhead">${cap}${d.tznote?`<p class="tznote">${esc(d.tznote)}</p>`:""}</div>`;
  v.innerHTML = `${head}
    ${d.alerts.length?`<ul class="alerts">${d.alerts.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:""}
    <ol class="tl">${rows}</ol>${d.approx?`<p class="approx">${esc(d.approx)}</p>`:""}`;
  v.querySelectorAll(".check").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.key; S.done[k] = !S.done[k]; if (!S.done[k]) delete S.done[k]; save(); renderDay();
  }));
}

/* ---------- Render: bookings ---------- */
function renderBookings(){
  const v = document.getElementById("view-bookings");
  v.innerHTML = `<h2>Bookings</h2><p>Every confirmation, with its calendar event and email.</p>` + BOOKINGS.map(b => `
    <article class="bk"><header><span class="ico" aria-hidden="true">${b.ico}</span><div><h3>${esc(b.name)}</h3><p class="when2">${esc(b.when)}</p></div></header>
      <div class="ref"><code>${esc(b.ref)}</code><button class="copy" data-copy="${esc(b.ref)}">Copy</button>${b.pin?`<span class="fine">${esc(b.pin)}</span>`:""}</div>
      <ul>${b.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
      <div class="links">${b.links.map(([l,h])=>`<a class="btn" href="${h}" ${h.startsWith("tel:")?"":'target="_blank" rel="noopener"'}>${esc(l)}</a>`).join("")}</div>
    </article>`).join("");
  v.querySelectorAll(".copy").forEach(b => b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; }
    catch(e) { b.textContent = "Select and copy"; }
    setTimeout(() => b.textContent = "Copy", 1600);
  }));
}

/* ---------- Render: packing ---------- */
function renderPack(){
  const v = document.getElementById("view-pack");
  const all = PACK.flatMap(g => g.items.map(i => i[0]));
  const left = all.filter(id => !S.pack[id]).length;
  v.innerHTML = `<div class="pkhead"><h2>Packing</h2><span class="fine">${left ? `${left} left` : "All packed"}</span></div>
    ${((TRIP.packing && TRIP.packing.intro) || []).map(x => `<div class="${esc(x.cls||"note")}">${x.html}</div>`).join("")}` +
    PACK.map(g => `<h3 class="sub">${esc(g.group)}</h3>${g.note?`<p class="fine">${esc(g.note)}</p>`:""}
      <ul class="cl">${g.items.map(([id,t]) => `<li class="${S.pack[id]?"done":""}">
        <button class="check" aria-pressed="${!!S.pack[id]}" aria-label="${esc(t)}" data-p="${id}">✓</button><span>${esc(t)}</span></li>`).join("")}</ul>`).join("") +
    `<p class="fine">Ticks are saved in this browser only.</p>`;
  v.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.p; S.pack[id] = !S.pack[id]; if (!S.pack[id]) delete S.pack[id]; save(); renderPack();
  }));
}

/* ---------- Render: prep ---------- */
function renderCheck(){
  const v = document.getElementById("view-check");
  const P = TRIP.prep || {};
  const OPEN = TODO.filter(t => !t.done), DONE = TODO.filter(t => t.done);
  const left = OPEN.filter(t => !S.todo[t.id]).length;
  const today = nowIn(TRIP.tz).date;
  const sect = x => {
    if (x.type === "deadlines") return `<h3 class="sub">${esc(x.title||"Key dates")}</h3>${x.note?`<p class="fine">${esc(x.note)}</p>`:""}
      <table class="dl"><tbody>${(P.deadlines||[]).map(d => `<tr class="${today > d.date ? "past" : ""}"><td>${esc(d.when)}</td><td>${esc(d.what)}<br><span class="fine">${esc(d.after||"")}</span></td></tr>`).join("")}</tbody></table>`;
    if (x.type === "money") return `<h3 class="sub">${esc(x.title||"Money")}</h3>${x.note?`<p class="fine">${esc(x.note)}</p>`:""}
      <table class="money"><tbody>${x.rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}
      ${x.total?`<tr class="tot"><td>${esc(x.total[0])}</td><td>${esc(x.total[1])}</td><td>${esc(x.total[2])}</td></tr>`:""}</tbody></table>
      ${x.after?`<p class="fine">${x.after}</p>`:""}`;
    return `<h3 class="sub">${esc(x.title)}</h3>${x.html||""}`;
  };
  v.innerHTML = `<h2>Prep</h2><p>${left ? `${left} still open` : "All done"}</p>
    <ul class="cl">${OPEN.map(t => `<li class="${S.todo[t.id]?"done":""}">
      <button class="check" aria-pressed="${!!S.todo[t.id]}" aria-label="${esc(t.text)}" data-id="${t.id}">✓</button>
      <span>${t.href?`<a href="${t.href}" target="_blank" rel="noopener">${esc(t.text)}</a>`:esc(t.text)}${t.sub?`<small>${esc(t.sub)}</small>`:""}</span></li>`).join("")}</ul>
    ${DONE.length?`<h3 class="sub">Done ✓</h3>
    <ul class="cl">${DONE.map(t => `<li class="done"><button class="check" aria-pressed="true" disabled aria-label="${esc(t.text)} — done">✓</button><span>${esc(t.text)}</span></li>`).join("")}</ul>`:""}
    ${(P.sections||[]).map(sect).join("\n")}`;
  v.querySelectorAll("[data-id]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.id; S.todo[id] = !S.todo[id]; if (!S.todo[id]) delete S.todo[id]; save(); renderCheck();
  }));
  v.querySelectorAll(".copy").forEach(b => b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; }
    catch(e) { b.textContent = "Select and copy"; }
    setTimeout(() => b.textContent = "Copy", 1600);
  }));
}

/* ---------- Trip map ---------- */
function mapsLink(day){
  const e = encodeURIComponent, s = day.stops, o = s[0], d = s[s.length-1], mid = s.slice(1, -1);
  let u = "https://www.google.com/maps/dir/?api=1&origin=" + e(o[0] + ", " + (TRIP.city||"")) + "&origin_place_id=" + o[3]
    + "&destination=" + e(d[0] + ", " + (TRIP.city||"")) + "&destination_place_id=" + d[3] + "&travelmode=" + day.mode;
  if (mid.length) u += "&waypoints=" + e(mid.map(m => m[0] + ", " + (TRIP.city||"")).join("|")) + "&waypoint_place_ids=" + mid.map(m => m[3]).join("|");
  return u;
}

function renderMap(){
  const v = document.getElementById("view-map");
  if (!TRIP_MAP.length) { v.innerHTML = "<h2>Trip map</h2><p>No map yet. Add a \"map\" list to the trip JSON to see each day's route here.</p>"; return; }
  const i = (typeof S.mapDay === "number" && TRIP_MAP[S.mapDay]) ? S.mapDay : 0;
  const day = TRIP_MAP[i], W = 340, H = 250, P = 36, L = "ABCDEFGHIJ";
  const lat0 = day.stops.reduce((a, s) => a + s[1], 0) / day.stops.length, k = Math.cos(lat0 * Math.PI / 180);
  const raw = day.stops.map(s => ({x: s[2] * k, y: -s[1]}));
  let minx = Math.min(...raw.map(p => p.x)), maxx = Math.max(...raw.map(p => p.x));
  let miny = Math.min(...raw.map(p => p.y)), maxy = Math.max(...raw.map(p => p.y));
  const MIN = 0.006;
  if (maxx - minx < MIN) { const c = (minx + maxx) / 2; minx = c - MIN / 2; maxx = c + MIN / 2; }
  if (maxy - miny < MIN) { const c = (miny + maxy) / 2; miny = c - MIN / 2; maxy = c + MIN / 2; }
  const sc = Math.min((W - 2 * P) / (maxx - minx), (H - 2 * P) / (maxy - miny));
  const ox = (W - (maxx - minx) * sc) / 2, oy = (H - (maxy - miny) * sc) / 2;
  const pts = raw.map(p => ({x: ox + (p.x - minx) * sc, y: oy + (p.y - miny) * sc}));
  for (let a = 1; a < pts.length; a++) for (let b = 0; b < a; b++) {
    if (Math.hypot(pts[a].x - pts[b].x, pts[a].y - pts[b].y) < 24) { pts[a].x += 20; pts[a].y += 16; }
  }
  let grid = "";
  for (let x = 20; x < W; x += 40) grid += `<line class="grid" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;
  for (let y = 20; y < H; y += 40) grid += `<line class="grid" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;
  const route = "M" + pts.map(p => p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" L");
  const boxes = pts.map(p => ({x1: p.x - 12, y1: p.y - 12, x2: p.x + 12, y2: p.y + 12}));
  const hit = (r) => r.x1 < 2 || r.x2 > W - 2 || boxes.some(q => r.x1 < q.x2 && r.x2 > q.x1 && r.y1 < q.y2 && r.y2 > q.y1);
  const labels = pts.map((p, j) => {
    const name = day.stops[j][0], short = name.length > 22 ? name.slice(0, 21) + "…" : name, w = short.length * 6.3;
    for (const side of [1, -1]) {
      const x1 = side > 0 ? p.x + 15 : p.x - 15 - w, r = {x1, y1: p.y - 8, x2: x1 + w, y2: p.y + 7};
      if (!hit(r)) { boxes.push(r); return `<text class="mlabel" x="${(side > 0 ? p.x + 15 : p.x - 15).toFixed(1)}" y="${(p.y + 4).toFixed(1)}" text-anchor="${side > 0 ? "start" : "end"}">${esc(short)}</text>`; }
    }
    return "";
  }).join("");
  const pins = labels + pts.map((p, j) => {
    return `<g class="pin" style="animation-delay:${(0.15 + j * 0.2).toFixed(2)}s"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="11" fill="#D93025" stroke="#fff" stroke-width="2"/>`
      + `<text x="${p.x.toFixed(1)}" y="${(p.y + 4).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="11" font-weight="800" font-family="Bricolage Grotesque, system-ui, sans-serif">${L[j]}</text></g>`;
  }).join("");
  v.innerHTML = `<h2>Trip map</h2><p>Each day's stops, in order. Tap a day to switch.</p>
    <div class="mapchips" role="group" aria-label="Choose a day">${TRIP_MAP.map((d, n) => `<button class="mapchip" aria-pressed="${n === i}" data-m="${n}">${esc(d.label)}</button>`).join("")}</div>
    <p class="daytitle"><b>${esc(day.label)}</b> — ${esc(day.title)} · ${day.stops.length} stops</p>
    <div class="mapcard"><svg class="mapsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Route for ${esc(day.label)}: ${esc(day.stops.map(s => s[0]).join(", "))}">
      ${grid}<text class="north" x="${W - 16}" y="20" text-anchor="middle">N↑</text>
      <path class="route" d="${route}"/>${pins}</svg></div>
    <a class="btn gmaps" href="${mapsLink(day)}" target="_blank" rel="noopener">Open this day in Google Maps</a>
    <ol class="stoplist">${day.stops.map((s, j) => `<li><span class="pinbadge">${L[j]}</span><span><b>${esc(s[0])}</b><small>${esc(s[4])}</small></span></li>`).join("")}</ol>
    <p class="fine">A simplified sketch of each day's route, not to scale between distant stops. The Google Maps button opens the full route with every stop; you can change the travel mode there.</p>`;
  v.querySelectorAll(".mapchip").forEach(b => b.addEventListener("click", () => { S.mapDay = Number(b.dataset.m); save(); renderMap(); }));
}

/* ---------- Tabs ---------- */
function setTab(t){
  S.tab = t; save();
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===t));
  document.getElementById("view-days").hidden = t!=="days";
  document.getElementById("view-bookings").hidden = t!=="bookings";
  document.getElementById("view-map").hidden = t!=="map";
  document.getElementById("view-pack").hidden = t!=="pack";
  document.getElementById("view-check").hidden = t!=="check";
  document.getElementById("days").hidden = t!=="days";
  window.scrollTo({top:0});
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

/* ---------- Keep content clear of the tab bar ---------- */
(function(){
  const bar = document.querySelector(".tabbar");
  const set = () => document.documentElement.style.setProperty("--tabh", bar.getBoundingClientRect().height + "px");
  set();
  if ("ResizeObserver" in window) new ResizeObserver(set).observe(bar);
  window.addEventListener("resize", set);
})();

/* ---------- Init ---------- */
const todayDay = DAYS.find(isToday);
if (todayDay) S.day = todayDay.id;
if (!DAYS.some(d => d.id === S.day)) S.day = DAYS[0].id;
document.getElementById("status").textContent = status();
renderStrip(); renderDay(); renderMap(); renderBookings(); renderPack(); renderCheck(); setTab(["days","map","bookings","pack","check"].includes(S.tab) ? S.tab : "days");
setInterval(() => { if (S.tab === "days") renderDay(); }, 60000);
</script>
